[package]
name = "musicpresence"
version = "0.1.0"
edition = "2021"
description = "Shows your currently playing music from any SMTC player (YouTube Music, Spotify, ...) as Discord Rich Presence"
license = "MIT"

[dependencies]
discord-rich-presence = "1.1"
winreg = "0.55"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
] }

[profile.release]
opt-level = 2
lto = "thin"
